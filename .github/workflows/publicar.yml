name: Regenerar y publicar Portal de Investigación

on:
  push:
    branches: ["main"]
    paths:
      - "datos/**"
      - "assets/**"
      - "css/**"
      - "js/app.js"
      - "index.html"
      - "scripts/**"
      - ".github/workflows/publicar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerar datos desde Excel maestro
        run: python scripts/generar_portal.py

      - name: Preparar sitio estático
        run: |
          mkdir -p _site/css _site/js _site/assets/icons
          cp index.html _site/
          cp css/styles.css _site/css/
          cp js/app.js js/portales.generated.js _site/js/
          cp assets/icons/* _site/assets/icons/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
